name: Vaultie DRM Prototyp - Windows Testpaket
on:
  push:
    branches: [prototype/castlabs-drm, development/vaultie-castlabs-browser]
    paths:
      - 'drm-prototype/**'
      - '.github/workflows/drm-prototype.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  drm-test:
    runs-on: windows-2022
    timeout-minutes: 45
    defaults:
      run:
        working-directory: drm-prototype
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install castLabs ECS (official release)
        shell: pwsh
        run: |
          npm ci --no-audit --no-fund
          if ($LASTEXITCODE -ne 0) { throw 'castLabs Installation fehlgeschlagen' }
          # ECS exposes install.js but does not declare an automatic npm install script.
          # Run the bundled official downloader explicitly, then verify electron.exe.
          node node_modules/electron/install.js
          if ($LASTEXITCODE -ne 0) { throw 'castLabs Binary-Download fehlgeschlagen' }
      - name: Check syntax and castLabs binary
        shell: pwsh
        run: |
          npm run check
          if ($LASTEXITCODE -ne 0) { throw 'Syntaxpruefung fehlgeschlagen' }
          Write-Host 'ECS package resolution and installed files:'
          node -p "require.resolve('electron')"
          node -p "JSON.stringify(require('./node_modules/electron/package.json'),null,2)"
          Get-ChildItem 'node_modules/electron' -Force | Select-Object Name, Length, Mode
          if (Test-Path 'node_modules/electron/path.txt') { Get-Content 'node_modules/electron/path.txt' }
          if (Test-Path 'node_modules/electron/dist') { Get-ChildItem 'node_modules/electron/dist' | Select-Object -First 15 Name, Length }
          if (-not (Test-Path 'node_modules/electron/dist/electron.exe')) { throw 'ECS electron.exe fehlt' }
          Get-Item 'node_modules/electron/dist/electron.exe' | Select-Object FullName, Length
      - name: Test browser functions
        run: npm test
      - name: Smoke-test actual Windows Electron runtime
        shell: pwsh
        run: |
          $env:VAULTIE_SMOKE = '1'
          $env:VAULTIE_TEST_USER_DATA = Join-Path $env:RUNNER_TEMP 'vaultie-smoke'
          node node_modules/electron/cli.js .
          if ($LASTEXITCODE -ne 0) { throw 'Windows-Browsertest fehlgeschlagen' }
      - name: Package Windows diagnostic prototype
        shell: pwsh
        run: |
          npm run package
          if ($LASTEXITCODE -ne 0) { throw 'Windows Paketierung fehlgeschlagen' }
          $exe = Get-ChildItem 'output' -Filter '*.exe' -File -Recurse | Where-Object { $_.Name -match 'Vaultie' } | Select-Object -First 1
          if (-not $exe) { throw 'Windows DRM-Prototyp EXE fehlt' }
          Write-Host "Test executable: $($exe.FullName)"
      - name: Upload internal test artifact (no public release)
        uses: actions/upload-artifact@v4
        with:
          name: Vaultie-castLabs-Windows-v0.3.0
          path: |
            drm-prototype/output/*.exe
            drm-prototype/output/*.blockmap
          if-no-files-found: error
