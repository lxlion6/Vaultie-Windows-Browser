name: Vaultie Windows Setup EXE bauen

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'Vaultie_Windows_Setup_Buildpaket/Windows/**'
      - '.github/workflows/windows-setup.yml'

permissions:
  contents: write

concurrency:
  group: vaultie-windows-release
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 45
    defaults:
      run:
        working-directory: Vaultie_Windows_Setup_Buildpaket/Windows
    steps:
      - name: Quellcode laden
        uses: actions/checkout@v4
      - name: Python bereitstellen
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: x64
      - name: .NET 8 für WebView2 bereitstellen
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Lokalen Bandbreitenbegrenzer testen
        shell: pwsh
        run: |
          python -m py_compile browser.py bandwidth_proxy.py storage_manager.py credentials.py
          node --check assets/fingerprint.js
          if ($LASTEXITCODE -ne 0) { throw 'Fingerprint-Skript hat Syntaxfehler' }
          python -m unittest -v test_bandwidth_proxy test_storage_manager test_credentials
          if ($LASTEXITCODE -ne 0) { throw 'Bandbreitenbegrenzer-Test fehlgeschlagen' }
      - name: Bibliotheken installieren
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pip-audit
          python -m pip_audit --local
          if ($LASTEXITCODE -ne 0) { throw 'Paket-Schwachstellenprüfung fehlgeschlagen' }
      - name: Vaultie kompilieren
        shell: pwsh
        run: |
          python -m PyInstaller --noconfirm --clean --windowed --name Vaultie `
            --icon assets/vaultie.ico `
            --add-data "assets;assets" `
            --collect-all PySide6.QtWebEngineCore `
            --collect-all PySide6.QtWebEngineWidgets `
            browser.py
          if (-not (Test-Path 'dist/Vaultie/Vaultie.exe')) { throw 'Programmdatei fehlt' }
      - name: Native Windows-Medien-Engine erstellen
        shell: pwsh
        run: |
          dotnet publish Streaming/Vaultie.Streaming.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:PublishTrimmed=false -o Streaming/publish
          if ($LASTEXITCODE -ne 0) { throw 'WebView2-Streaming-Build fehlgeschlagen' }
          if (-not (Test-Path 'Streaming/publish/Vaultie.Streaming.exe')) { throw 'WebView2-EXE fehlt' }
          Copy-Item 'Streaming/publish/*' 'dist/Vaultie/' -Recurse -Force
          if (-not (Test-Path 'dist/Vaultie/Vaultie.Streaming.exe')) { throw 'WebView2-EXE fehlt im Installer' }
      - name: Installer erstellen
        shell: pwsh
        run: |
          choco install innosetup --yes --no-progress
          if ($LASTEXITCODE -ne 0) { throw 'Inno Setup konnte nicht installiert werden' }
          & 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe' 'Vaultie.iss'
          if ($LASTEXITCODE -ne 0) { throw 'Installer konnte nicht erstellt werden' }
      - name: Setup bereitstellen
        uses: actions/upload-artifact@v4
        with:
          name: Vaultie-Windows-Installer
          path: Vaultie_Windows_Setup_Buildpaket/Windows/installer_output/Vaultie-Setup.exe
          if-no-files-found: error

      - name: Fertigen Installer direkt veröffentlichen
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = 'windows-latest'
          $installer = 'installer_output/Vaultie-Setup.exe'
          if (-not (Test-Path $installer)) { throw 'Installer nicht vorhanden' }
          $releases = gh release list --limit 100 --json tagName | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { throw 'GitHub Releases nicht erreichbar' }
          if ($releases | Where-Object { $_.tagName -eq $tag }) {
            gh release upload $tag $installer --clobber
          } else {
            gh release create $tag $installer --target $env:GITHUB_SHA --title 'Vaultie Windows - aktuelle Version' --notes 'Windows 11 Setup. Unsignierte Windows-Installationsdatei.' --prerelease
          }
          if ($LASTEXITCODE -ne 0) { throw 'GitHub Release Upload fehlgeschlagen' }
          $versionLine = (Get-Content 'Vaultie.iss' | Select-String '^#define MyAppVersion').Line
          if ($versionLine -notmatch '"([0-9.]+)"') { throw 'Version fehlt' }
          gh release edit $tag --notes "Version: $($Matches[1])`nWindows 11 Setup. Unsignierte Installationsdatei."
          if ($LASTEXITCODE -ne 0) { throw 'Release-Versionsmeldung fehlgeschlagen' }
