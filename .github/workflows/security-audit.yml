name: Vaultie Sicherheitspruefung

on:
  workflow_dispatch:
  schedule:
    - cron: "15 4 * * 1"

permissions:
  contents: read

jobs:
  dependency-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Quellcode laden
        uses: actions/checkout@v4
      - name: Python bereitstellen
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Abhaengigkeiten anhand externer Schwachstellendatenbank pruefen
        run: |
          python -m pip install --upgrade pip pip-audit
          python -m pip_audit -r Vaultie_Windows_Setup_Buildpaket/Windows/requirements.txt
      - name: Fingerprinting-Schutz auf JavaScript-Syntax pruefen
        run: node --check Vaultie_Windows_Setup_Buildpaket/Windows/assets/fingerprint.js
